title = "Eigencube"
summary = "A Rubik's cube with no sticker tables: 26 cubelets, each a point of {-1, 0, 1}^3 carrying a 3-by-3 rotation matrix. A turn picks the cubelets on its side with a dot product and moves them with a matrix product; the stickers are read back from the matrices; a search solves it, layer by layer."
