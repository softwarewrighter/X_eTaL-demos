[package]
name = "sandpile-web"
description = "The abelian sandpile in the browser: every cell topples at once, round after round, by X_eTaL"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement", "Element", "DomRect"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[workspace]
