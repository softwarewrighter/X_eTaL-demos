[package]
name = "mandelbrot-web"
description = "The Mandelbrot set in the browser: the X_eTaL program run on a view, the set appearing step by step, a point's orbit"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
xetal-play = { path = "../../../vendor/xetal/components/web/crates/xetal-play" }
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "HtmlInputElement", "DomRect", "Element", "Window", "Performance"] }
console_error_panic_hook = "0.1"

[workspace]
