[package]
name = "mandelbrot-web"
description = "The Mandelbrot set in the browser: the X_eTaL program run on a view, the set appearing step by step, a point's orbit"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
console_error_panic_hook = "0.1"

[workspace]
