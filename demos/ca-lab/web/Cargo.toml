[package]
name = "ca-lab-web"
description = "A cellular automata lab in the browser: elementary and 2-D rules as lookup tables, run by X_eTaL"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement", "Window", "Location"] }
console_error_panic_hook = "0.1"

[workspace]
