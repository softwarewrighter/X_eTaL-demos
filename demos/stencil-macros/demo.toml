slug = "stencil-macros"
title = "Stencils by macro"
summary = "Image kernels written as pictures of numbers, turned into code by a macro library of our own when the program is expanded: blur, edges, sharpen, emboss and heat each cost exactly their nonzero numbers. See the call, what it expands to, and the result."
wiki = "https://en.wikipedia.org/wiki/Stencil_code"
idea = "A kernel is data, but its zeros need not cost anything: a macro reads the numbers once, when the program is expanded, and writes one rotation per nonzero number, so the program is the unrolled stencil."
