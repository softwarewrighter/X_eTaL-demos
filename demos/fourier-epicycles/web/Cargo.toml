[package]
name = "fourier-epicycles-web"
description = "Fourier epicycles in the browser: a curve's discrete Fourier transform as matrix products by X_eTaL, drawn as circles on circles"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
microscope = { path = "../../../shared/microscope" }
yew = { version = "0.21", features = ["csr"] }
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement", "Element", "DomRect"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[workspace]
